      <!-- KV -->
      <div class="section collapsible">
        <div class="section-header">
          <div class="row">
            <div class="title-wrap">
              <button class="collapse-btn">−</button>
              <h2>KV – Kalibrierung & Validierung</h2>
            </div>
            <button class="btn icon" onclick="addKV()">+ Zeile</button>
          </div>
        </div>
        <div class="section-body">
          <div class="list" id="kvList"></div>
        </div>
      </div>

      <!-- IQ -->
      <div class="section collapsible">
        <div class="section-header">
          <div class="row">
            <div class="title-wrap">
              <button class="collapse-btn">−</button>
              <h2>IQ – Installation Qualification</h2>
            </div>
            <button class="btn icon" onclick="addIQ()">+ Zeile</button>
          </div>
        </div>
        <div class="section-body">
          <div class="list" id="iqList"></div>
        </div>
      </div>

      <!-- OQ -->
      <div class="section collapsible">
        <div class="section-header">
          <div class="row">
            <div class="title-wrap">
              <button class="collapse-btn">−</button>
              <h2>OQ – Operational Qualification</h2>
            </div>
            <button class="btn icon" onclick="addOQ()">+ Zeile</button>
          </div>
        </div>
        <div class="section-body">
          <div class="list" id="oqList"></div>
        </div>
      </div>

      <!-- Dynamische Gruppen (Verschiebbar) -->
      <div id="groupsContainer"></div>
    </div>
  </div>

  <!-- Modal für Abschnittstypen -->
  <div class="modal" id="sectionTypeModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">Abschnittstyp wählen</div>
        <button class="modal-close" id="sectionTypeClose">×</button>
      </div>
      <div class="section-type-grid">
        <div class="section-type-card" data-type="checklist">
          <div class="icon">✓</div>
          <div class="name">Checkliste</div>
        </div>
        <div class="section-type-card" data-type="spacing">
          <div class="icon">↕</div>
          <div class="name">Abstand</div>
        </div>
        <div class="section-type-card" data-type="text">
          <div class="icon">📝</div>
          <div class="name">Text</div>
        </div>
        <div class="section-type-card" data-type="image">
          <div class="icon">🖼</div>
          <div class="name">Bilder</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    function $(s){ return document.querySelector(s); }
    function $$(s){ return document.querySelectorAll(s); }
    function clone(o){ return JSON.parse(JSON.stringify(o)); }

    /* State */
    var appState = {
      nameEinrichtung:'', standortInstallation:'', verantwortlichePerson:'', produkt:'',
      programmPaket:'', version:'', softwarepflege:'', arbeitsplaetze:'', angebundeneGeraete:'',
      bemerkungInstallation:'', validierungDatum:'', letzteValidierung:'', naechsteValidierung:'',
      checkValidierung:false, checkRevalidierung:false,
      validiererName:'', qualifikation:'', produktschulung:'',
      unterschriftValidierer:'', freigabeBetreiber:'',
      kv:[], iq:[], oq:[],
      groups:[]
    };

    var currentGroupIndex = 0;

    /* Defaults */
    var defaultKV=[
      {text:'Konformität mit Spezifikation', ok:false, note:'', code:'KV-001', info:'Prüfung der technischen Spezifikationen'},
      {text:'Messgenauigkeit überprüft', ok:false, note:'', code:'KV-002', info:'Vergleich mit kalibriertem Referenzgerät'},
      {text:'Kalibrierzertifikat vorhanden', ok:false, note:'', code:'KV-003', info:'Aktuelles Zertifikat vom akkreditierten Labor'}
    ];
    var iqItems=[
      {text:'Lieferumfang vollständig', ok:false, note:'', code:'IQ-001', info:'Alle Komponenten und Zubehör vorhanden'},
      {text:'Gerät unbeschädigt', ok:false, note:'', code:'IQ-002', info:'Sichtprüfung auf Transportschäden'},
      {text:'Installation gemäß Handbuch', ok:false, note:'', code:'IQ-003', info:'Befolgen der Herstellervorgaben'}
    ];
    var oqItems=[
      {text:'Funktionstest erfolgreich', ok:false, note:'', code:'OQ-001', info:'Alle Basisfunktionen getestet'},
      {text:'Alarmfunktionen getestet', ok:false, note:'', code:'OQ-002', info:'Akustische und optische Alarme'},
      {text:'Temperaturkonstanz geprüft', ok:false, note:'', code:'OQ-003', info:'24h-Monitoring durchgeführt'}
    ];

    /* Persistence */
    var formFields = [
      'nameEinrichtung','standortInstallation','verantwortlichePerson','produkt',
      'programmPaket','version','softwarepflege','arbeitsplaetze','angebundeneGeraete',
      'bemerkungInstallation','validierungDatum','letzteValidierung','naechsteValidierung',
      'checkValidierung','checkRevalidierung',
      'validiererName','qualifikation','produktschulung',
      'unterschriftValidierer','freigabeBetreiber'
    ];

    function sync(){
      formFields.forEach(function(k){
        var el = document.getElementById(k);
        if(el){
          if(el.type === 'checkbox') appState[k] = el.checked;
          else appState[k] = el.value;
        }
      });
      localStorage.setItem('validierung_v3_fixed', JSON.stringify(appState));
    }

    function loadState(){
      try{
        var stored = localStorage.getItem('validierung_v3_fixed');
        if(!stored) return false;
        var data = JSON.parse(stored);
        Object.assign(appState, data);
        formFields.forEach(function(k){
          var el = document.getElementById(k);
          if(el){
            if(el.type === 'checkbox') el.checked = appState[k] || false;
            else el.value = appState[k] || '';
          }
        });
        return true;
      }catch(e){ return false; }
    }

    function exportJSON(){
      var blob = new Blob([JSON.stringify(appState, null, 2)], {type:'application/json'});
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'validierung_'+Date.now()+'.json';
      a.click();
    }

    function importJSON(){
      var input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = function(){
        var file = input.files[0];
        if(!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          try{
            var data = JSON.parse(e.target.result);
            Object.assign(appState, data);
            renderAll();
            alert('✓ Daten erfolgreich geladen');
          }catch(err){ alert('✗ Fehler beim Laden: '+err.message); }
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function resetAll(){
      if(!confirm('Alle Daten löschen?')) return;
      localStorage.removeItem('validierung_v3_fixed');
      location.reload();
    }

    /* Listen (KV/IQ/OQ) mit Code + Move Handle + funktionierendem Delete */
    function renderList(selector, items, onUpdate){
      var container = document.querySelector(selector);
      if(!container) return;
      container.innerHTML = '';
      items.forEach(function(item, i){
        var row = document.createElement('div');
        row.className = 'check';
        
        // Escape HTML für textarea
        var escapeHtml = function(text) {
          var div = document.createElement('div');
          div.textContent = text || '';
          return div.innerHTML;
        };
        
        row.innerHTML = `
          <div class="move-btns">
            <div class="move-handle" draggable="true" data-index="${i}">
              <span></span>
            </div>
          </div>
          <textarea class="tiny" placeholder="Code" rows="1">${escapeHtml(item.code)}</textarea>
          <button class="info-btn" title="${escapeHtml(item.info)}"></button>
          <textarea class="label-input" placeholder="Prüfpunkt..." rows="1">${escapeHtml(item.text)}</textarea>
          <textarea class="note" placeholder="Bemerkung..." rows="1">${escapeHtml(item.note)}</textarea>
          <input type="checkbox" ${item.ok?'checked':''} />
          <div class="manage">
            <button class="btn icon tiny del">✕</button>
          </div>
        `;

        var codeInput = row.querySelector('.tiny');
        var labelInput = row.querySelector('.label-input');
        var noteInput = row.querySelector('.note');
        var checkbox = row.querySelector('input[type="checkbox"]');
        var delBtn = row.querySelector('.del');
        
        // Auto-resize textareas
        var autoResize = function(textarea) {
          textarea.style.height = 'auto';
          textarea.style.height = textarea.scrollHeight + 'px';
        };

        codeInput.oninput = function(){ 
          item.code = codeInput.value; 
          autoResize(codeInput);
          onUpdate(); 
        };
        labelInput.oninput = function(){ 
          item.text = labelInput.value; 
          autoResize(labelInput);
          onUpdate(); 
        };
        noteInput.oninput = function(){ 
          item.note = noteInput.value; 
          autoResize(noteInput);
          onUpdate(); 
        };
        checkbox.onchange = function(){ item.ok = checkbox.checked; onUpdate(); };
        
        // Initial resize
        setTimeout(function(){
          autoResize(codeInput);
          autoResize(labelInput);
          autoResize(noteInput);
        }, 0);
        
        // FIXED: Delete Button
        delBtn.onclick = function(e){
          e.preventDefault();
          e.stopPropagation();
          items.splice(i, 1);
          renderList(selector, items, onUpdate);
          onUpdate();
        };

        // Drag & Drop
        var handle = row.querySelector('.move-handle');
        handle.ondragstart = function(e){ 
          e.dataTransfer.effectAllowed='move'; 
          e.dataTransfer.setData('text/plain', i); 
        };
        row.ondragover = function(e){ 
          e.preventDefault(); 
          e.dataTransfer.dropEffect='move'; 
        };
        row.ondrop = function(e){
          e.preventDefault();
          var from = parseInt(e.dataTransfer.getData('text/plain'));
          var to = i;
          if(from !== to){
            var movedItem = items.splice(from, 1)[0];
            items.splice(to, 0, movedItem);
            renderList(selector, items, onUpdate);
            onUpdate();
          }
        };

        container.appendChild(row);
      });
    }

    /* Collapse */
    function initCollapsibles(){
      $$('.section.collapsible').forEach(function(section){
        var btn = section.querySelector('.collapse-btn');
        if(!btn) return;
        btn.onclick = function(){
          section.classList.toggle('collapsed');
          btn.textContent = section.classList.contains('collapsed') ? '+' : '−';
        };
      });
    }

    /* Gruppen rendern mit Drag & Drop */
    function drawGroups(){
      var host = document.getElementById('groupsContainer');
      if(!host) return;
      host.innerHTML = '';

      if(!appState.groups || appState.groups.length === 0){
        appState.groups = [{ id: Date.now(), title:'Gruppe 1', enabled:true, collapsed:false, sections:[] }];
      }

      appState.groups.forEach(function(g, gIdx){
        var group = document.createElement('div');
        group.className = 'group';
        group.setAttribute('draggable', 'true');
        group.setAttribute('data-group-index', gIdx);
        if(!g.enabled) group.classList.add('disabled');
        if(g.collapsed) group.classList.add('collapsed');

        // Drag & Drop für Gruppen
        group.ondragstart = function(e){
          e.stopPropagation();
          group.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', gIdx);
        };
        
        group.ondragend = function(e){
          group.classList.remove('dragging');
          $$('.group').forEach(function(g){ g.classList.remove('drag-over'); });
        };
        
        group.ondragover = function(e){
          e.preventDefault();
          e.stopPropagation();
          var dragging = $('.group.dragging');
          if(dragging && dragging !== group){
            e.dataTransfer.dropEffect = 'move';
            group.classList.add('drag-over');
          }
        };
        
        group.ondragleave = function(e){
          if(!group.contains(e.relatedTarget)){
            group.classList.remove('drag-over');
          }
        };
        
        group.ondrop = function(e){
          e.preventDefault();
          e.stopPropagation();
          group.classList.remove('drag-over');
          
          var fromIndex = parseInt(e.dataTransfer.getData('text/plain'));
          var toIndex = gIdx;
          
          if(fromIndex !== toIndex){
            var movedGroup = appState.groups.splice(fromIndex, 1)[0];
            appState.groups.splice(toIndex, 0, movedGroup);
            drawGroups();
            sync();
          }
        };

        var header = document.createElement('div');
        header.className = 'group-header';
        
        var titleSection = document.createElement('div');
        titleSection.className = 'group-title-section';
        
        // Move Handle
        var moveHandle = document.createElement('div');
        moveHandle.className = 'group-move-handle';
        moveHandle.innerHTML = '<span></span>';
        moveHandle.title = 'Gruppe verschieben';
        
        var collapseBtn = document.createElement('div');
        collapseBtn.className = 'group-collapse-btn';
        collapseBtn.onclick = function(e){
          e.stopPropagation();
          g.collapsed = !g.collapsed;
          drawGroups();
          sync();
        };
        
        var titleInput = document.createElement('input');
        titleInput.type = 'text';
        titleInput.className = 'group-title-input';
        titleInput.value = g.title || 'Gruppe ' + (gIdx + 1);
        titleInput.placeholder = 'Gruppenname...';
        titleInput.oninput = function(e){
          e.stopPropagation();
          g.title = titleInput.value;
          sync();
        };
        titleInput.onclick = function(e){ e.stopPropagation(); };
        titleInput.ondragstart = function(e){ e.preventDefault(); };
        
        titleSection.appendChild(moveHandle);
        titleSection.appendChild(collapseBtn);
        titleSection.appendChild(titleInput);
        
        var actions = document.createElement('div');
        actions.className = 'group-actions';
        
        var toggleBtn = document.createElement('div');
        toggleBtn.className = 'group-toggle' + (g.enabled ? ' active' : '');
        toggleBtn.textContent = g.enabled ? '✓ Aktiviert' : '✗ Deaktiviert';
        toggleBtn.onclick = function(e){
          e.stopPropagation();
          g.enabled = !g.enabled;
          drawGroups();
          sync();
        };
        
        var duplicateBtn = document.createElement('div');
        duplicateBtn.className = 'group-btn duplicate';
        duplicateBtn.title = 'Gruppe duplizieren';
        duplicateBtn.onclick = function(e){
          e.stopPropagation();
          var newGroup = clone(g);
          newGroup.id = Date.now() + Math.random();
          newGroup.title = g.title + ' (Kopie)';
          appState.groups.splice(gIdx + 1, 0, newGroup);
          drawGroups();
          sync();
        };
        
        // FIXED: Delete Button
        var deleteBtn = document.createElement('div');
        deleteBtn.className = 'group-btn delete';
        deleteBtn.title = 'Gruppe löschen';
        deleteBtn.onclick = function(e){
          e.preventDefault();
          e.stopPropagation();
          if(confirm('Gruppe "' + g.title + '" wirklich löschen?')){
            appState.groups.splice(gIdx, 1);
            drawGroups();
            sync();
          }
        };
        
        actions.appendChild(toggleBtn);
        actions.appendChild(duplicateBtn);
        actions.appendChild(deleteBtn);
        
        header.appendChild(titleSection);
        header.appendChild(actions);
        
        var content = document.createElement('div');
        content.className = 'group-content';
        
        if(!g.sections) g.sections = [];
        
        g.sections.forEach(function(s, sIdx){
          var sectionDiv = document.createElement('div');
          sectionDiv.className = 'section';
          
          if(s.type === 'checklist') renderChecklistSection(sectionDiv, s, g.sections, sIdx);
          else if(s.type === 'spacing') renderSpacingSection(sectionDiv, s, g.sections, sIdx);
          else if(s.type === 'text') renderTextSection(sectionDiv, s, g.sections, sIdx);
          else if(s.type === 'image') renderImageSection(sectionDiv, s, g.sections, sIdx);
          
          content.appendChild(sectionDiv);
        });
        
        var addSection = document.createElement('div');
        addSection.className = 'group-add-section';
        var addBtn = document.createElement('button');
        addBtn.className = 'btn';
        addBtn.innerHTML = '➕ Abschnitt hinzufügen';
        addBtn.onclick = function(){
          currentGroupIndex = gIdx;
          addDynamicSection();
        };
        addSection.appendChild(addBtn);
        content.appendChild(addSection);
        
        group.appendChild(header);
        group.appendChild(content);
        host.appendChild(group);
      });

      updatePageBreaks();
      initCollapsibles();
    }

    /* Checklisten-Abschnitt mit Code + Move Handle + funktionierendem Delete */
    function renderChecklistSection(host, section, sections, sIdx){
      var header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <div class="row">
          <div class="title-wrap">
            <button class="collapse-btn">−</button>
            <input type="text" value="${section.title||'Checkliste'}" placeholder="Titel..." 
                   style="border:1px solid transparent;background:transparent;font-weight:700;color:var(--primary);font-size:18px;padding:4px 6px;border-radius:8px" />
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn icon add-row-btn">+ Zeile</button>
            <button class="btn icon del-section-btn">✕</button>
          </div>
        </div>
      `;
      
      var titleInput = header.querySelector('input');
      titleInput.oninput = function(){ section.title = titleInput.value; sync(); };
      
      var addBtn = header.querySelector('.add-row-btn');
      addBtn.onclick = function(e){
        e.preventDefault();
        e.stopPropagation();
        if(!section.rows) section.rows = [];
        section.rows.push({text:'Neuer Punkt', ok:false, note:'', code:''});
        renderChecklistSection(host, section, sections, sIdx);
        sync();
      };
      
      // FIXED: Delete Button
      var delBtn = header.querySelector('.del-section-btn');
      delBtn.onclick = function(e){
        e.preventDefault();
        e.stopPropagation();
        if(confirm('Abschnitt löschen?')){
          sections.splice(sIdx, 1);
          drawGroups();
          sync();
        }
      };
      
      var body = document.createElement('div');
      body.className = 'section-body';
      var list = document.createElement('div');
      list.className = 'list';
      
      if(!section.rows) section.rows = [];
      section.rows.forEach(function(row, rIdx){
        var rowDiv = document.createElement('div');
        rowDiv.className = 'check';
        
        // Escape HTML für textarea
        var escapeHtml = function(text) {
          var div = document.createElement('div');
          div.textContent = text || '';
          return div.innerHTML;
        };
        
        rowDiv.innerHTML = `
          <div class="move-btns">
            <div class="move-handle" draggable="true">
              <span></span>
            </div>
          </div>
          <textarea class="tiny" placeholder="Code" rows="1">${escapeHtml(row.code)}</textarea>
          <textarea class="label-input" placeholder="Punkt..." rows="1">${escapeHtml(row.text)}</textarea>
          <textarea class="note" placeholder="Bemerkung..." rows="1">${escapeHtml(row.note)}</textarea>
          <input type="checkbox" ${row.ok?'checked':''} />
          <button class="btn icon tiny del">✕</button>
        `;
        
        var codeInput = rowDiv.querySelector('.tiny');
        var labelInput = rowDiv.querySelector('.label-input');
        var noteInput = rowDiv.querySelector('.note');
        var checkbox = rowDiv.querySelector('input[type="checkbox"]');
        var delRowBtn = rowDiv.querySelector('.del');
        
        // Auto-resize textareas
        var autoResize = function(textarea) {
          textarea.style.height = 'auto';
          textarea.style.height = textarea.scrollHeight + 'px';
        };
        
        codeInput.oninput = function(){ 
          row.code = codeInput.value; 
          autoResize(codeInput);
          sync(); 
        };
        labelInput.oninput = function(){ 
          row.text = labelInput.value; 
          autoResize(labelInput);
          sync(); 
        };
        noteInput.oninput = function(){ 
          row.note = noteInput.value; 
          autoResize(noteInput);
          sync(); 
        };
        checkbox.onchange = function(){ row.ok = checkbox.checked; sync(); };
        
        // Initial resize
        setTimeout(function(){
          autoResize(codeInput);
          autoResize(labelInput);
          autoResize(noteInput);
        }, 0);
        
        // FIXED: Delete Button
        delRowBtn.onclick = function(e){
          e.preventDefault();
          e.stopPropagation();
          section.rows.splice(rIdx, 1);
          renderChecklistSection(host, section, sections, sIdx);
          sync();
        };
        
        // Drag & Drop
        var handle = rowDiv.querySelector('.move-handle');
        handle.ondragstart = function(e){ 
          e.dataTransfer.effectAllowed='move'; 
          e.dataTransfer.setData('text/plain', rIdx); 
        };
        rowDiv.ondragover = function(e){ 
          e.preventDefault(); 
          e.dataTransfer.dropEffect='move'; 
        };
        rowDiv.ondrop = function(e){
          e.preventDefault();
          var from = parseInt(e.dataTransfer.getData('text/plain'));
          var to = rIdx;
          if(from !== to){
            var movedRow = section.rows.splice(from, 1)[0];
            section.rows.splice(to, 0, movedRow);
            renderChecklistSection(host, section, sections, sIdx);
            sync();
          }
        };
        
        list.appendChild(rowDiv);
      });
      
      body.appendChild(list);
      host.innerHTML = '';
      host.appendChild(header);
      host.appendChild(body);
      
      var collapseBtn = header.querySelector('.collapse-btn');
      collapseBtn.onclick = function(){
        host.classList.toggle('collapsed');
        collapseBtn.textContent = host.classList.contains('collapsed') ? '+' : '−';
      };
    }

    /* Abstand-Abschnitt */
    function renderSpacingSection(host, section, sections, sIdx){
      if(!section.heightCm) section.heightCm = 5;
      
      var header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <div class="row">
          <h2>Abstand</h2>
          <button class="btn icon del">✕</button>
        </div>
      `;
      
      // FIXED: Delete Button
      var delBtn = header.querySelector('.del');
      delBtn.onclick = function(e){
        e.preventDefault();
        e.stopPropagation();
        if(confirm('Abschnitt löschen?')){
          sections.splice(sIdx, 1);
          drawGroups();
          sync();
        }
      };
      
      var body = document.createElement('div');
      body.className = 'section-body';
      body.innerHTML = `
        <div class="spacing-section">
          <div class="controls">
            <label style="margin:0">Höhe (cm):</label>
            <input type="number" value="${section.heightCm}" min="1" max="20" style="width:80px" />
          </div>
          <div class="preview" style="height:${section.heightCm * 10}px">↕ ${section.heightCm} cm Abstand</div>
        </div>
      `;
      
      var heightInput = body.querySelector('input[type="number"]');
      var preview = body.querySelector('.preview');
      heightInput.oninput = function(){
        section.heightCm = parseFloat(heightInput.value) || 5;
        preview.style.height = (section.heightCm * 10) + 'px';
        preview.textContent = '↕ ' + section.heightCm + ' cm Abstand';
        sync();
      };
      
      host.innerHTML = '';
      host.appendChild(header);
      host.appendChild(body);
    }

    /* Text-Abschnitt */
    function renderTextSection(host, section, sections, sIdx){
      if(!section.content) section.content = '';
      
      var header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <div class="row">
          <input type="text" value="${section.title||'Text'}" placeholder="Titel..." 
                 style="border:1px solid transparent;background:transparent;font-weight:700;color:var(--primary);font-size:18px;padding:4px 6px;border-radius:8px" />
          <button class="btn icon del">✕</button>
        </div>
      `;
      
      var titleInput = header.querySelector('input');
      titleInput.oninput = function(){ section.title = titleInput.value; sync(); };
      
      // FIXED: Delete Button
      var delBtn = header.querySelector('.del');
      delBtn.onclick = function(e){
        e.preventDefault();
        e.stopPropagation();
        if(confirm('Abschnitt löschen?')){
          sections.splice(sIdx, 1);
          drawGroups();
          sync();
        }
      };
      
      var body = document.createElement('div');
      body.className = 'section-body';
      body.innerHTML = `
        <div class="text-section">
          <div class="text-editor-toolbar">
            <button data-cmd="bold"><strong>B</strong></button>
            <button data-cmd="italic"><em>I</em></button>
            <button data-cmd="underline"><u>U</u></button>
          </div>
          <div class="text-editor-content" contenteditable="true">${section.content}</div>
        </div>
      `;
      
      var editor = body.querySelector('.text-editor-content');
      var toolbar = body.querySelector('.text-editor-toolbar');
      
      editor.oninput = function(){
        section.content = editor.innerHTML;
        sync();
      };
      
      toolbar.querySelectorAll('button').forEach(function(btn){
        btn.onclick = function(){
          document.execCommand(btn.getAttribute('data-cmd'), false, null);
          editor.focus();
        };
      });
      
      host.innerHTML = '';
      host.appendChild(header);
      host.appendChild(body);
    }

    /* Bild-Abschnitt */
    function renderImageSection(host, section, sections, sIdx){
      if(!section.images) section.images = [];
      
      var header = document.createElement('div');
      header.className = 'section-header';
      header.innerHTML = `
        <div class="row">
          <input type="text" value="${section.title||'Bilder'}" placeholder="Titel..." 
                 style="border:1px solid transparent;background:transparent;font-weight:700;color:var(--primary);font-size:18px;padding:4px 6px;border-radius:8px" />
          <button class="btn icon del">✕</button>
        </div>
      `;
      
      var titleInput = header.querySelector('input');
      titleInput.oninput = function(){ section.title = titleInput.value; sync(); };
      
      // FIXED: Delete Button
      var delBtn = header.querySelector('.del');
      delBtn.onclick = function(e){
        e.preventDefault();
        e.stopPropagation();
        if(confirm('Abschnitt löschen?')){
          sections.splice(sIdx, 1);
          drawGroups();
          sync();
        }
      };
      
      var body = document.createElement('div');
      body.className = 'section-body';
      body.innerHTML = `
        <div class="image-section">
          <div class="image-upload-zone">
            📸 Klicken oder Bilder hierher ziehen
            <input type="file" accept="image/*" multiple style="display:none" />
          </div>
          <div class="image-preview"></div>
        </div>
      `;
      
      var zone = body.querySelector('.image-upload-zone');
      var fileInput = zone.querySelector('input[type="file"]');
      var preview = body.querySelector('.image-preview');
      
      zone.onclick = function(){ fileInput.click(); };
      
      zone.ondragover = function(e){
        e.preventDefault();
        zone.classList.add('dragover');
      };
      zone.ondragleave = function(){ zone.classList.remove('dragover'); };
      zone.ondrop = function(e){
        e.preventDefault();
        zone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
      };
      
      fileInput.onchange = function(){ handleFiles(fileInput.files); };
      
      function handleFiles(files){
        Array.from(files).forEach(function(file){
          if(!file.type.startsWith('image/')) return;
          var reader = new FileReader();
          reader.onload = function(e){
            section.images.push(e.target.result);
            renderImageSection(host, section, sections, sIdx);
            sync();
          };
          reader.readAsDataURL(file);
        });
      }
      
      section.images.forEach(function(src, imgIdx){
        var item = document.createElement('div');
        item.className = 'image-preview-item';
        item.innerHTML = `
          <img src="${src}" />
          <button class="delete-btn">✕</button>
        `;
        var delImgBtn = item.querySelector('.delete-btn');
        delImgBtn.onclick = function(e){
          e.preventDefault();
          e.stopPropagation();
          section.images.splice(imgIdx, 1);
          renderImageSection(host, section, sections, sIdx);
          sync();
        };
        preview.appendChild(item);
      });
      
      host.innerHTML = '';
      host.appendChild(header);
      host.appendChild(body);
    }

    /* Modal */
    var pendingSectionCallback = null;
    function showSectionTypeModal(cb){
      pendingSectionCallback = cb;
      $('#sectionTypeModal').classList.add('active');
    }
    function closeSectionTypeModal(){
      $('#sectionTypeModal').classList.remove('active');
      pendingSectionCallback = null;
    }
    
    $('#sectionTypeClose').onclick = closeSectionTypeModal;
    $('#sectionTypeModal').onclick = function(e){
      if(e.target === this) closeSectionTypeModal();
    };
    
    $$('.section-type-card').forEach(function(card){
      card.onclick = function(){
        var type = card.getAttribute('data-type');
        if(pendingSectionCallback){
          var cb = pendingSectionCallback;
          closeSectionTypeModal();
          cb(type);
        }
      };
    });

    function addDynamicSection(){
      showSectionTypeModal(function(type){
        var g = appState.groups[currentGroupIndex];
        if(!g){
          appState.groups = [{ id: Date.now(), title:'Gruppe 1', enabled:true, collapsed:false, sections:[] }];
          g = appState.groups[0];
          currentGroupIndex = 0;
        }
        
        var section = {
          type: type || 'checklist',
          title: 'Neuer Abschnitt',
          id: Date.now()
        };
        
        if(section.type === 'checklist') section.rows = [];
        if(section.type === 'spacing') section.heightCm = 5;
        if(section.type === 'text') section.content = '';
        if(section.type === 'image') section.images = [];
        
        if(!g.sections) g.sections = [];
        g.sections.push(section);
        
        drawGroups();
        sync();
      });
    }

    /* Seitenumbruch-Markierungen */
    var pageBreaksOn = false;
    function updatePageBreaks(){
      var container = document.getElementById('pageBreakMarkers');
      if(!container) return;
      container.innerHTML = '';
      if(!pageBreaksOn) return;

      var contentEl = document.getElementById('app');
      var totalH = Math.max(contentEl.scrollHeight, contentEl.offsetHeight);
      
      var pageHeightPx = 1032;
      var count = Math.floor(totalH / pageHeightPx);
      
      for(var i = 1; i <= count; i++){
        var y = i * pageHeightPx;
        
        var line = document.createElement('div');
        line.className = 'page-break-line';
        line.style.top = y + 'px';
        
        var label = document.createElement('div');
        label.className = 'page-break-label';
        label.style.top = y + 'px';
        label.textContent = 'Seite ' + (i + 1);
        
        container.appendChild(line);
        container.appendChild(label);
      }
    }

    /* Init */
    function addKV(){ appState.kv.push({text:'Neue KV-Anforderung', ok:false, note:'', code:'', info:''}); renderAll(); sync(); }
    function addIQ(){ appState.iq.push({text:'Neue IQ-Prüfung', ok:false, note:'', code:'', info:''}); renderAll(); sync(); }
    function addOQ(){ appState.oq.push({text:'Neue OQ-Prüfung', ok:false, note:'', code:'', info:''}); renderAll(); sync(); }

    function renderAll(){
      renderList('#kvList', appState.kv, sync);
      renderList('#iqList', appState.iq, sync);
      renderList('#oqList', appState.oq, sync);
      drawGroups();
    }

    function initAll(){
      var btn = $('#hamburgerBtn');
      var menu = $('#hamburgerMenu');
      if(btn && menu){
        btn.onclick = function(e){
          e.stopPropagation();
          btn.classList.toggle('active');
          menu.classList.toggle('active');
        };
        document.addEventListener('click', function(e){
          if(!menu.contains(e.target) && !btn.contains(e.target)){
            btn.classList.remove('active');
            menu.classList.remove('active');
          }
        });
      }

      if(!loadState()){
        appState.kv = clone(defaultKV);
        appState.iq = clone(iqItems);
        appState.oq = clone(oqItems);
        appState.groups = [{ id: Date.now(), title:'Gruppe 1', enabled:true, collapsed:false, sections:[] }];
      }
      renderAll();
      $('#stamp').textContent = (new Date()).toLocaleString('de-DE');

      $('#btnSave').onclick = exportJSON;
      $('#btnLoad').onclick = importJSON;
      $('#btnPDF').onclick = function(){
        btn.classList.remove('active');
        menu.classList.remove('active');
        window.print();
      };
      $('#btnReset').onclick = resetAll;
      $('#btnNewSectionMenu').onclick = function(e){
        e.preventDefault();
        e.stopPropagation();
        addDynamicSection();
        setTimeout(function(){
          btn.classList.remove('active');
          menu.classList.remove('active');
        }, 100);
      };
      $('#btnNewGroup').onclick = function(){
        appState.groups.push({
          id: Date.now() + Math.random(),
          title: 'Neue Gruppe',
          enabled: true,
          collapsed: false,
          sections: []
        });
        currentGroupIndex = appState.groups.length - 1;
        drawGroups();
        sync();
      };
      
      $('#btnPageBreaks').onclick = function(){
        pageBreaksOn = !pageBreaksOn;
        var overlay = $('#pageBreakMarkers');
        overlay.classList.toggle('hidden', !pageBreaksOn);
        $('#pageBreakState').textContent = pageBreaksOn ? 'An' : 'Aus';
        requestAnimationFrame(function(){
          updatePageBreaks();
          requestAnimationFrame(updatePageBreaks);
        });
      };

      $$('[data-clear-text]').forEach(function(b){
        b.addEventListener('click', function(){
          var id = b.getAttribute('data-clear-text');
          var el = document.getElementById(id);
          if(el) el.value = '';
          sync();
        });
      });

      formFields.forEach(function(id){
        var el = document.getElementById(id);
        if(el){
          if(el.type === 'checkbox') el.onchange = sync;
          else el.oninput = sync;
        }
      });

      if(window.ResizeObserver){
        new ResizeObserver(updatePageBreaks).observe($('#app'));
      }
      window.addEventListener('resize', updatePageBreaks);
      new MutationObserver(function(){
        if(pageBreaksOn) updatePageBreaks();
      }).observe($('#app'), {childList:true, subtree:true});
      
      /* Tabellen-Header für Print automatisch einfügen */
      window.addEventListener('beforeprint', function(){
        $$('.list').forEach(function(list){
          if(!list.querySelector('.table-header-row')){
            var header = document.createElement('div');
            header.className = 'table-header-row';
            header.style.cssText = 'display:grid !important;grid-template-columns:8% 62% 20% 10% !important;background:#e8eaf0;border-bottom:1.5pt solid #8B1538;font-weight:700;font-size:9pt;color:#1E2434;padding:2.5mm 0;page-break-after:avoid;margin:0;';
            header.innerHTML = '<div style="padding:2mm;text-align:center;border-right:0.5pt solid #cbd5e1;display:flex;align-items:center;justify-content:center;">Code</div><div style="padding:2mm 2mm 2mm 3mm;border-right:0.5pt solid #cbd5e1;display:flex;align-items:center;">Prüfpunkt</div><div style="padding:2mm;border-right:0.5pt solid #cbd5e1;display:flex;align-items:center;">Bemerkung</div><div style="padding:2mm;text-align:center;display:flex;align-items:center;justify-content:center;">OK</div>';
            list.insertBefore(header, list.firstChild);
          }
        });
      });
      
      window.addEventListener('afterprint', function(){
        $$('.table-header-row').forEach(function(header){
          header.remove();
        });
      });
    }

    if(document.readyState === 'loading'){
      window.addEventListener('DOMContentLoaded', initAll);
    } else {
      initAll();
    }
  </script>
</body>
</html>
