  <meta http-equiv="refresh" content="0; url=./Apps-Hub.html">
  <script>
    // Fallback & pfadsicher (respektiert /<repo>/ Unterpfade)
    (function () {
      var base = location.pathname.endsWith('/') 
        ? location.pathname 
        : location.pathname.replace(/[^/]+$/, '');
      // 👉 Ziel anpassen, falls dein Dateiname anders lautet
      var target = 'Apps-Hub.html'; 
      location.replace(base + target);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=Apps-Hub.html">
  </noscript>

    body{font-family:system-ui,-apple-system,Arial,sans-serif;background:#F8F9FB;color:#1E2434;

  </style>
</head>
