<!DOCTYPE html>
<html data-theme="dark" lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
<title>Apps Hub</title>

<meta name="theme-color" content="#8B1538" />

<style>
:root{
  --brand:#8B1538;
  --bg:#0b0f1a;
  --surface:#111826;
  --text:#e9edf3;
  --muted:#6e7a94;
  --border:rgba(255,255,255,.12);
  --glassA:rgba(12,16,27,.65);
  --glassB:rgba(12,16,27,.35);
  --radius:22px;
  --gap:18px;
  --card-w:260px;
  --card-h:180px;
  --scale-hover:1.06;
  --scale-focus:1.10;
}

html[data-theme="light"]{
  --bg:#f4f6fb;
  --surface:#ffffff;
  --text:#0f172a;
  --muted:#4b556b;
  --border:rgba(15,23,42,.12);
  --glassA:rgba(255,255,255,.75);
  --glassB:rgba(255,255,255,.55);
}

*{box-sizing:border-box;}
html,body{height:100%;}

body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 800px at 70% -10%, color-mix(in srgb,var(--brand),transparent 85%) 15%, transparent 60%),
    linear-gradient(180deg,var(--bg) 0%,color-mix(in srgb,var(--bg),#000 8%) 100%);
  overflow-x:hidden;
}

.backdrop{
  position:fixed; inset:0; z-index:-1;
  pointer-events:none;
  background:center/cover no-repeat;
  filter:blur(40px) saturate(120%) brightness(75%);
  opacity:.35;
  transition:background-image .35s ease;
}

/* HEADER */
header{
  position:sticky; top:0; z-index:10;
  backdrop-filter:blur(12px) saturate(160%);
  background:linear-gradient(180deg, color-mix(in srgb,var(--bg),#000 20%) 85%, transparent);
  border-bottom:1px solid var(--border);
}
.topbar{
  max-width:1400px;
  margin:0 auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  gap:12px;
}
.logo{
  width:32px; height:32px;
  border-radius:8px;
  overflow:hidden;
}
.logo img{
  width:100%; height:100%; object-fit:contain;
}

/* PAGE */
.page{
  max-width:1400px;
  margin:24px auto 90px;
  padding:0 30px;
}

/* HERO */
.hero{
  margin:10px 0 6px;
  border-radius:var(--radius);
  overflow:hidden;
  background:color-mix(in srgb,var(--bg),#000 20%);
  display:grid;
  grid-template-columns:minmax(280px,1fr) minmax(380px,1fr);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}
.hero .art{
  min-height:300px;
  background:center/cover no-repeat;
}
.hero .info{
  padding:28px 26px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:14px;
  background:linear-gradient(180deg, color-mix(in srgb,var(--bg),#000 10%) 0%, color-mix(in srgb,var(--bg),#000 15%) 100%);
}
.badge{
  display:inline-flex; align-items:center; gap:8px;
  font-size:12px; opacity:.85;
}
.badge .dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--brand);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--brand),transparent 75%);
}
.hero h1{margin:0; font-size:28px;}
.hero p{margin:0; color:var(--muted);}
.actions{display:flex; gap:12px; margin-top:10px; flex-wrap:wrap;}
.btn{
  border:none; padding:12px 18px;
  border-radius:12px; font-weight:700;
  cursor:pointer;
}
.btn.primary{background:var(--brand); color:#fff;}
.btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border);}

/* APPS */
.row{margin-top:24px;}
.row h2{font-size:18px; margin:0 0 10px 6px; opacity:.9;}

.strip{
  display:flex;
  gap:var(--gap);
  justify-content:center;
  flex-wrap:wrap;
  padding:16px 60px 32px;
}

.card{
  position:relative;
  width:var(--card-w); height:var(--card-h);
  border-radius:18px;
  background:var(--surface);
  overflow:hidden;
  cursor:pointer;
  flex-shrink:0;
  box-shadow:0 10px 24px rgba(0,0,0,.35);
}
.thumb{
  position:absolute; inset:0;
  background:center/cover no-repeat;
}

.label{
  position:absolute; left:10px; right:10px; bottom:10px;
  padding:8px 10px;
  display:flex; align-items:center;
  gap:8px;
  background:linear-gradient(180deg,var(--glassA),var(--glassB));
  border-radius:10px;
  backdrop-filter:blur(8px);
  border:1px solid var(--border);
}

.label .ico{
  width:16px; height:16px; border-radius:6px;
  background:linear-gradient(135deg,var(--brand),#f05880);
}

/* ===== UNIVERSAL HANDY FIX – GILT FÜR ALLE SMARTPHONES ===== */
@media(max-width: 820px){

  .page{
    padding:0 14px;
  }

  .hero{
    grid-template-columns:1fr !important;
    border-radius:var(--radius);
  }

  .hero .art{
    min-height:40vh !important;
    background-position:center !important;
    background-size:cover !important;
    border-bottom-left-radius:var(--radius);
    border-bottom-right-radius:var(--radius);
  }

  #apps .strip{
    display:grid !important;
    grid-template-columns:repeat(2, 1fr) !important;
    gap:12px !important;
    padding:16px 10px !important;
  }

  #apps .card{
    width:100% !important;
    height:180px !important;
  }
}

/* FOOTER */
footer{
  text-align:center;
  color:var(--muted);
  margin:40px 0;
}
</style>
</head>

<body>

<div class="backdrop" id="backdrop"></div>

<header>
  <div class="topbar">
    <div class="logo">
      <img src="photos/Logo.png" alt="App Logo" id="brandLogo">
    </div>
    <div class="brand">Apps Hub</div>
  </div>
</header>

<main class="page">

<!-- HERO -->
<section class="hero">
  <div class="art" id="heroArt"></div>
  <div class="info">
    <div class="badge"><span class="dot"></span> Neu & empfohlen</div>
    <h1>Dein zentraler Startpunkt</h1>
    <p>Schneller Zugriff auf deine Web-Apps mit sauberem Look.</p>
    <div class="actions">
      <button class="btn primary" id="btnInfo">Info</button>
      <button class="btn ghost" id="btnTheme">Modus: Hell</button>
    </div>
  </div>
</section>

<section class="row" id="apps">
<h2>Apps</h2>
<div class="strip">

<!-- Tätigkeitsbericht -->
<article class="card" data-img="photos/Tätigkeitsbericht.png" data-bg="photos/Tätigkeitsbericht.png" data-link="Tätigkeitsbericht.html">
  <div class="thumb"></div>
  <div class="label"><span class="ico"></span>Tätigkeitsbericht</div>
</article>

<!-- Reisekosten -->
<article class="card" data-img="photos/Reisekosten.png" data-bg="photos/Reisekosten.png" data-link="Reisekosten.html">
  <div class="thumb"></div>
  <div class="label"><span class="ico"></span>Reisekosten</div>
</article>

<!-- EuroSDS -->
<article class="card" data-img="photos/EuroSDS.png" data-bg="photos/EuroSDS.png" data-link="EuroSDS.html">
  <div class="thumb"></div>
  <div class="label"><span class="ico"></span>EuroSDS</div>
</article>

<!-- Validierung -->
<article class="card" data-img="photos/Validierung.png" data-bg="photos/Validierung.png" data-link="Validierung.html">
  <div class="thumb"></div>
  <div class="label"><span class="ico"></span>Validierung</div>
</article>

<!-- Wissen -->
<article class="card" data-img="photos/Wissen.png" data-bg="photos/Wissen.png" data-link="Wissen.html">
  <div class="thumb"></div>
  <div class="label"><span class="ico"></span>Wissen</div>
</article>

<!-- Mehrarbeit -->
<article class="card" data-img="photos/Mehrarbeit.png" data-bg="photos/Mehrarbeit.png" data-link="Mehrarbeit.html">
  <div class="thumb"></div>
  <div class="label"><span class="ico"></span>Mehrarbeit</div>
</article>

</div>
</section>

<footer>Apps Hub – Version 25.0.4 • Entwickelt von Nexus IPS (MENA)</footer>

</main>

<script>
(function(){

  /* HERO */
  const heroArt=document.getElementById('heroArt');
  heroArt.style.backgroundImage="url('photos/Hero.png')";

  const backdrop=document.getElementById('backdrop');

  /* Kachelbilder setzen */
  document.querySelectorAll('.card').forEach(c=>{
    const t=c.querySelector('.thumb');
    const img=c.dataset.img;
    if(img) t.style.backgroundImage=`url('${img}')`;
  });

  /* Backdrop dynamisch */
  function setBackdrop(card){
    const url=card?.dataset?.bg || "";
    if(url) backdrop.style.backgroundImage=`url('${url}')`;
  }

  const first=document.querySelector('.card');
  if(first) setBackdrop(first);

  document.addEventListener('mouseenter',e=>{
    const c=e.target.closest?.('.card');
    if(c) setBackdrop(c);
  },true);

  /* Klick */
  document.addEventListener('click',e=>{
    const c=e.target.closest?.('.card');
    if(c){
      const href=c.dataset.link;
      if(href) location.href = href;
    }
  });

  /* Theme */
  const themeBtn=document.getElementById('btnTheme');
  function apply(t){
    document.documentElement.setAttribute('data-theme',t);
    localStorage.setItem('theme',t);
    themeBtn.textContent = t==='light' ? 'Modus: Dunkel' : 'Modus: Hell';
  }
  apply(localStorage.getItem('theme')||'dark');

  themeBtn.onclick=()=>apply(
    document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'
  );

})();
</script>

</body>
</html>
