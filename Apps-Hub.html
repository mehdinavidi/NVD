<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Hub - Nexus/IPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2d1b2e 0%, #4a2545 50%, #2d1b2e 100%);
            min-height: 100vh;
            color: white;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 20px 40px;
            gap: 12px;
        }

        .header-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #8B1538 0%, #a81d45 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-icon::before {
            content: "◼◼";
            font-size: 12px;
            color: white;
        }

        .header h1 {
            font-size: 1.3em;
            font-weight: 600;
        }

        /* Hero Section */
        .hero {
            margin: 40px 40px 60px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 350px;
        }

        .hero-image {
            background: url('photos/Hero.jpg');
            background-size: cover;
            background-position: center;
        }

        .hero-content {
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(139, 21, 56, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 20px;
            width: fit-content;
        }

        .hero-badge::before {
            content: "🆕";
        }

        .hero-title {
            font-size: 2.5em;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero-description {
            font-size: 1.1em;
            opacity: 0.9;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 10px;
            border: none;
            font-size: 1em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #8B1538;
            color: white;
        }

        .btn-primary:hover {
            background: #a81d45;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Apps Section */
        .apps-section {
            padding: 0 40px 60px;
        }

        .apps-title {
            font-size: 2em;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
        }

        /* App Card */
        .app-card {
            border-radius: 20px;
            overflow: hidden;
            height: 280px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: flex;
            flex-direction: column;
        }

        .app-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.4);
        }

        .app-card-bg {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .app-card-bg img {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 4px 20px rgba(0,0,0,0.2));
        }

        .app-card-label {
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .app-card-label::before {
            content: "●";
            color: #8B1538;
            font-size: 1.2em;
        }

        .app-card-title {
            font-size: 1.1em;
            font-weight: 500;
            color: white;
        }

        /* Individual App Colors */
        .app-taetigkeitsbericht { background: linear-gradient(135deg, #8B1538 0%, #c41f4a 100%); }
        .app-reisekosten { background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8f 100%); }
        .app-eurosds { background: linear-gradient(135deg, #e8e8e8 0%, #ffffff 100%); }
        .app-validierung { background: linear-gradient(135deg, #1e7acc 0%, #4fa3e0 100%); }
        .app-wissen { background: linear-gradient(135deg, #ff9500 0%, #ffb347 100%); }
        .app-mehrarbeit { background: linear-gradient(135deg, #00a896 0%, #02c9b3 100%); }

        /* EuroSDS special styling (white background) */
        .app-eurosds .app-card-label {
            background: rgba(139, 21, 56, 0.15);
        }

        .app-eurosds .app-card-title {
            color: #333;
        }

        .app-eurosds .app-card-label::before {
            color: #8B1538;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 40px;
            opacity: 0.6;
            font-size: 0.9em;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-image {
                min-height: 250px;
            }

            .hero-content {
                padding: 40px;
            }

            .hero-title {
                font-size: 2em;
            }
        }

        @media (max-width: 768px) {
            .header {
                padding: 20px;
            }

            .apps-section {
                padding: 0 20px 40px;
            }

            .hero {
                margin: 20px;
            }

            .hero-content {
                padding: 30px;
            }

            .hero-title {
                font-size: 1.8em;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-icon"></div>
        <h1>Apps Hub</h1>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <div class="hero-image"></div>
        <div class="hero-content">
            <div class="hero-badge">Neu & empfohlen</div>
            <h2 class="hero-title">Dein zentraler Startpunkt</h2>
            <p class="hero-description">
                Schneller Zugriff auf deine Web-Apps mit dynamischem Hintergrund und kompakten Kacheln.
            </p>
            <div class="hero-buttons">
                <button class="btn btn-primary">Info</button>
                <button class="btn btn-secondary">Modus: Hell</button>
            </div>
        </div>
    </div>

    <!-- Apps Section -->
    <div class="apps-section">
        <h2 class="apps-title">Apps</h2>
        <div class="apps-grid">
            <!-- Tätigkeitsbericht -->
            <a href="Tätigkeitsbericht.html" class="app-card app-taetigkeitsbericht">
                <div class="app-card-bg">
                    <img src="photos/tätigkeitsbericht.png" alt="Tätigkeitsbericht">
                </div>
                <div class="app-card-label">
                    <div class="app-card-title">Tätigkeitsbericht</div>
                </div>
            </a>

            <!-- Reisekosten -->
            <a href="Reisekostenabrechnung.html" class="app-card app-reisekosten">
                <div class="app-card-bg">
                    <img src="photos/Reisekosten.png" alt="Reisekosten">
                </div>
                <div class="app-card-label">
                    <div class="app-card-title">Reisekosten</div>
                </div>
            </a>

            <!-- EuroSDS -->
            <a href="EuroSDS.html" class="app-card app-eurosds">
                <div class="app-card-bg">
                    <img src="photos/EuroSDS.png" alt="EuroSDS">
                </div>
                <div class="app-card-label">
                    <div class="app-card-title">EuroSDS</div>
                </div>
            </a>

            <!-- Validierung -->
            <a href="Validierungs-Protokoll.html" class="app-card app-validierung">
                <div class="app-card-bg">
                    <img src="photos/Validierung.png" alt="Validierung">
                </div>
                <div class="app-card-label">
                    <div class="app-card-title">Validierung</div>
                </div>
            </a>

            <!-- Wissen -->
            <a href="Wissen.html" class="app-card app-wissen">
                <div class="app-card-bg">
                    <img src="photos/Wissen.png" alt="Wissen">
                </div>
                <div class="app-card-label">
                    <div class="app-card-title">Entwicklung</div>
                </div>
            </a>

            <!-- Mehrarbeit -->
            <a href="Mehrarbeit.html" class="app-card app-mehrarbeit">
                <div class="app-card-bg">
                    <img src="photos/Mehrarbeit.png" alt="Mehrarbeit">
                </div>
                <div class="app-card-label">
                    <div class="app-card-title">Mehrarbeit</div>
                </div>
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p><strong>Nexus/IPS</strong></p>
        <p>© 2024 Alle Rechte vorbehalten</p>
    </div>
</body>
</html>
