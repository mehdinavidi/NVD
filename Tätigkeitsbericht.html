<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Tätigkeitsbericht Pro</title>

  <style>
    /* ==================== DESIGN SYSTEM (Dunkelblau/Rot) ==================== */
    :root {
      /* --- DARK MODE (Standard) --- */
      --bg-app: #1E2434;
      --bg-panel: #252d3d;
      --bg-input: #2a3240;
      --bg-hover: #323b4d;
      --border-color: #3a4150;
      --text-main: #e2e8f0;
      --text-muted: #a0aec0;
      
      --accent-primary: #8B1538;
      --accent-hover: #6B1028;
      --accent-glow: rgba(139, 21, 56, 0.4);
      --danger: #ef4444;
      
      --gradient-header: linear-gradient(135deg, #1E2434 0%, #8B1538 100%);
      --shadow-panel: 0 20px 60px rgba(0,0,0,0.4);
    }

    /* --- LIGHT MODE OVERRIDES --- */
    body.light-theme {
      --bg-app: #f0f2f5;
      --bg-panel: #ffffff;
      --bg-input: #f7fafc;
      --bg-hover: #edf2f7;
      --border-color: #e2e8f0;
      --text-main: #2d3748;
      --text-muted: #718096;
      
      --accent-primary: #8B1538;
      --accent-hover: #6B1028;
      --accent-glow: rgba(139, 21, 56, 0.2);
      
      --gradient-header: linear-gradient(135deg, #1E2434 0%, #8B1538 100%);
      --shadow-panel: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* ==================== GLOBAL STYLES ==================== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      padding: 20px;
      min-height: 100vh;
      line-height: 1.5;
      transition: background-color 0.3s, color 0.3s;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Container Panel */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: var(--bg-panel);
      padding: 35px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-panel);
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    /* Typography */
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 25px;
      color: var(--text-main);
      letter-spacing: -0.5px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      text-align: center;
    }
    
    /* Light mode h1 with gradient */
    body.light-theme h1 {
      background: var(--gradient-header);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 18px;
      color: #fff;
      background: var(--accent-primary);
      padding: 15px 20px;
      border-radius: 12px;
      margin: 25px 0 15px 0;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    /* Form Elements */
    .label {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
      display: block;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 14px;
      transition: all 0.3s ease;
      margin-bottom: 12px;
    }

    input:hover, select:hover, textarea:hover {
      border-color: var(--bg-hover);
      background: var(--bg-panel);
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-glow);
      background: var(--bg-panel);
      transform: translateY(-1px);
    }
    
    textarea { min-height: 90px; resize: vertical; }

    /* Light Mode Input Styles */
    body.light-theme input,
    body.light-theme select,
    body.light-theme textarea {
      background: #f7fafc;
      border-color: #e2e8f0;
      color: #2d3748;
    }

    body.light-theme input:hover,
    body.light-theme select:hover,
    body.light-theme textarea:hover {
      background: #fff;
      border-color: #cbd5e0;
    }

    body.light-theme input:focus,
    body.light-theme select:focus,
    body.light-theme textarea:focus {
      background: #fff;
      border-color: #8B1538;
    }

    /* Header Grid Layout */
    .header-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 25px;
      margin-bottom: 28px;
    }

    .header-grid > div {
      background: var(--bg-input);
      border: 2px solid var(--border-color);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      transition: all 0.3s ease;
    }

    .header-grid > div:hover {
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      transform: translateY(-2px);
      border-color: var(--accent-primary);
    }

    .header-grid .label {
      background: var(--accent-primary);
      color: #fff;
      padding: 12px 16px;
      margin: 0;
      border-radius: 0;
      font-size: 13px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-grid input {
      margin: 0;
      border-radius: 0;
      border: none;
      border-top: 2px solid var(--border-color);
      font-size: 14px;
      padding: 14px 16px;
      text-align: center;
      background: var(--bg-panel);
    }

    /* Buttons Standard */
    .btn {
      background: var(--accent-primary);
      color: #fff;
      border: none;
      padding: 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      width: 100%;
      margin: 12px 0;
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      transform: translate(-50%,-50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn:hover::before {
      width: 300px;
      height: 300px;
    }
    
    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }
    
    .btn:active { 
      transform: translateY(0);
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    /* Secondary Button Style */
    .btn-secondary {
      background: var(--bg-input);
      color: var(--text-main);
      border: 2px solid var(--border-color);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .btn-secondary:hover {
      background: var(--bg-hover);
      border-color: var(--text-muted);
    }

    /* Danger Button */
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      box-shadow: none;
      border: 2px solid var(--danger);
    }
    .btn-danger:hover {
      background: var(--danger);
      color: white;
    }

    /* Table Icons / Row Buttons */
    .btn-row {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      margin: 4px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: var(--bg-panel);
      border: 2px solid var(--accent-primary);
      color: var(--accent-primary);
      transition: all 0.3s ease;
      box-shadow: 0 2px 8px var(--accent-glow);
    }
    .btn-row:hover { 
      background: var(--accent-primary); 
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px var(--accent-glow);
    }
    .btn-row:active { transform: translateY(0); }
    .btn-row.danger { border-color: var(--danger); color: var(--danger); }
    .btn-row.danger:hover { background: var(--danger); color: #fff; }

    /* SVG Icons Styling */
    .icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Table Styling */
    .table-wrap {
      overflow-x: auto;
      margin: 16px 0;
      border-radius: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    
    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      min-width: 700px;
      background: var(--bg-panel);
    }
    
    th {
      background: var(--accent-primary);
      color: #fff;
      padding: 14px 10px;
      font-size: 12px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: none;
    }

    th:first-child { border-top-left-radius: 15px; }
    th:last-child { border-top-right-radius: 15px; }
    
    td {
      border: 1px solid var(--border-color);
      border-top: none;
      padding: 10px 8px;
      text-align: center;
      font-size: 13px;
      color: var(--text-main);
      vertical-align: middle;
      background: var(--bg-panel);
      transition: all 0.2s ease;
    }
    
    tr:hover td { background: var(--bg-hover); }
    tr:last-child td:first-child { border-bottom-left-radius: 15px; }
    tr:last-child td:last-child { border-bottom-right-radius: 15px; }

    td input, td select {
      margin: 0;
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 8px;
    }

    tfoot td {
      background: var(--bg-input);
      font-weight: bold;
      border-color: var(--border-color);
    }

    .hours { 
      font-weight: 700; 
      color: var(--text-main); 
      font-family: monospace; 
      font-size: 15px; 
    }

    /* Stats Area */
    .stats {
      background: var(--accent-primary);
      color: #fff;
      border-radius: 15px;
      padding: 22px;
      margin: 18px 0;
      display: none;
      box-shadow: 0 10px 35px var(--accent-glow);
      transition: all 0.3s ease;
    }
    .stats:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 45px var(--accent-glow);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }
    .stat-item {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      padding: 14px;
      border-radius: 10px;
      text-align: center;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .stat-item:hover {
      background: rgba(255,255,255,0.25);
      transform: translateY(-2px);
    }
    .stat-label { 
      font-size: 11px; 
      opacity: 0.9;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .stat-value { 
      font-size: 22px; 
      font-weight: 700; 
      margin-top: 6px;
    }

    /* Upload & Signature Previews */
    .sig-preview, .logo-preview {
      border: 2px dashed var(--border-color);
      background: var(--bg-app);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100px;
      margin-top: 12px;
      transition: all 0.3s;
    }
    .sig-preview:hover, .logo-preview:hover { 
      border-color: var(--accent-primary);
      background: var(--bg-input);
    }
    
    /* White background for signature in dark mode */
    .sig-preview {
      background: #fff;
    }
    
    .sig-preview img, .logo-preview img { 
      max-height: 80px; 
      max-width: 100%; 
      object-fit: contain; 
    }
    .placeholder { 
      color: var(--text-muted); 
      font-style: italic; 
      font-weight: 500;
    }
    
    /* Modal */
    .modal {
      display: none;
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 30px;
      width: 95%;
      max-width: 800px;
      border-radius: 20px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
      animation: modalFadeIn 0.3s ease;
    }
    @keyframes modalFadeIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}

    .modal-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }
    .close {
      float: right;
      font-size: 32px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.3s ease;
      line-height: 1;
    }
    .close:hover {
      color: var(--text-main);
      transform: rotate(90deg);
    }
    .modal-btns { 
      display: grid; 
      grid-template-columns: 1fr 1fr 1fr; 
      gap: 12px; 
      margin-top: 20px; 
    }
    .canvas-box {
      background: #fff;
      border-radius: 15px;
      height: 300px;
      position: relative;
      cursor: crosshair;
      margin: 15px 0;
      border: 3px solid var(--accent-primary);
      box-shadow: 0 8px 25px var(--accent-glow);
      overflow: hidden;
    }
    #sigCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: crosshair;
    }
    .canvas-hint {
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%);
      color: #cbd5e0; 
      font-size: 18px;
      pointer-events: none;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .canvas-hint.hide { display: none; }

    /* Burger Menu & Action Buttons */
    .burger-toggle {
      position: fixed; 
      top: 15px; 
      right: 15px; 
      z-index: 1002;
      width: 45px; 
      height: 45px;
      background: var(--gradient-header);
      border: none;
      border-radius: 10px; 
      cursor: pointer;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center; 
      gap: 5px;
      box-shadow: 0 4px 15px var(--accent-glow);
      transition: all 0.3s ease;
    }
    .burger-toggle span { 
      width: 25px; 
      height: 3px; 
      background: #fff; 
      border-radius: 2px; 
      transition: all 0.3s; 
    }
    .burger-toggle.active span:nth-child(1) { transform: rotate(45deg) translate(7px, 7px); }
    .burger-toggle.active span:nth-child(2) { opacity: 0; }
    .burger-toggle.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -7px); }
    .burger-toggle:active { transform: scale(0.95); }

    .action-buttons {
      position: fixed; 
      top: 70px; 
      right: 15px; 
      width: 240px;
      background: var(--bg-panel);
      border: 2px solid var(--accent-primary);
      border-radius: 12px; 
      padding: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      display: none; 
      z-index: 1001;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
    }
    .action-buttons.active { 
      display: flex; 
      animation: slideIn 0.3s ease-out; 
    }
    @keyframes slideIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}

    .action-buttons .btn {
      margin: 0;
      width: 100%;
      font-size: 14px;
      padding: 12px 16px;
      height: 50px;
      border-radius: 10px;
      font-weight: 600;
      box-shadow: 0 2px 8px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    /* Saved Reports List */
    .report-item {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--accent-primary);
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .report-item:hover { 
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      border-left-color: var(--accent-hover);
    }
    .report-info strong { 
      color: var(--text-main); 
      display: block; 
    }
    .report-info small { 
      color: var(--text-muted); 
    }
    
    /* Toast Notification */
    .toast {
      position: fixed; 
      bottom: 25px; 
      left: 50%; 
      transform: translateX(-50%);
      background: var(--bg-panel); 
      color: var(--text-main);
      padding: 16px 24px; 
      border-radius: 12px; 
      font-size: 14px; 
      font-weight: 600;
      display: none; 
      z-index: 3000;
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
      border: 2px solid var(--accent-primary);
      animation: floatUp 0.3s ease-out;
    }
    @keyframes floatUp{from{opacity:0;transform:translate(-50%, 20px)}to{opacity:1;transform:translate(-50%, 0)}}
    .toast.success { border-color: #10b981; background: #10b981; color: #fff; }
    .toast.error { border-color: var(--danger); background: var(--danger); color: #fff; }

    /* Media Query Mobile */
    @media(max-width:768px){
      .container { padding: 20px; margin: 0; border-radius: 15px; }
      .header-grid { grid-template-columns: 1fr 1fr; }
      .modal-btns { grid-template-columns: 1fr; }
      .btn-row { padding: 8px 14px; }
      table { font-size: 11px; min-width: 650px; }
      th, td { padding: 9px 5px; }
      td input, td select { padding: 6px 9px; font-size: 12px; }
      .canvas-box { height: 280px; }
      .modal-content { width: 98%; padding: 20px; margin: 3% auto; }
    }

    /* ==================== PRINT STYLES (PDF) ==================== */
    @media screen { #printPages { display: none; } }
    @media print {
      @page { size: A4; margin: 15mm; }
      body { background: white !important; color: black !important; font-family: Arial, sans-serif; padding: 0; }
      .container, .burger-toggle, .action-buttons, .modal, .toast, .btn { display: none !important; }
      
      /* Remove all shadows in print */
      * { box-shadow: none !important; text-shadow: none !important; }
      
      #printPages { display: block !important; width: 100%; }
      .print-page { page-break-after: always; position: relative; height: 264mm; }
      .print-page:last-child { page-break-after: auto; }
      
      .print-header { 
        border-bottom: 2px solid #1E2434; 
        margin-bottom: 10mm; 
        padding-bottom: 5mm; 
        display: flex; 
        justify-content: space-between; 
        align-items: flex-start; 
      }
      .print-logo { 
        max-height: 25mm; 
        max-width: 50mm; 
        object-fit: contain;
        display: block;
      }
      .print-meta { flex: 1; }
      .meta-row { 
        display: flex; 
        margin-bottom: 3mm; 
        font-size: 11pt; 
        border-bottom: 1px dotted #ccc; 
        padding-bottom: 2px; 
      }
      .meta-label { font-weight: bold; width: 35mm; color: #1E2434; }
      
      .print-table { 
        width: 100%; 
        border-collapse: collapse; 
        font-size: 10pt; 
        margin-bottom: 5mm; 
      }
      .print-table th { 
        background: #1E2434 !important; 
        color: #fff !important;
        border: 1px solid #000; 
        padding: 3mm; 
        font-weight: bold; 
      }
      .print-table td { 
        border: 1px solid #000; 
        padding: 3mm; 
      }
      
      .print-footer { 
        position: absolute; 
        bottom: 0; 
        width: 100%; 
        font-size: 10pt; 
      }
      .sig-box { 
        border-top: 1px solid #000; 
        width: 60mm; 
        padding-top: 2mm; 
        margin-top: 10mm; 
      }
      .sig-img { 
        max-height: 15mm; 
        display: block; 
        margin-bottom: 5px; 
      }
      .page-num { 
        text-align: right; 
        margin-top: 5mm; 
        font-size: 9pt; 
        color: #666; 
      }
      
      .print-notes {
        border: 2px solid #8B1538;
        padding: 5mm;
        min-height: 20mm;
        margin-top: 5mm;
        background: #fff3f3 !important;
        border-radius: 5px;
      }
      .print-notes strong {
        color: #8B1538;
        display: block;
        margin-bottom: 3mm;
      }
    }
  </style>
</head>
<body>

  <button class="burger-toggle" onclick="toggleMobileMenu()" aria-label="Menü">
    <span></span><span></span><span></span>
  </button>

  <div class="action-buttons" id="mobileMenu">
    <button class="btn" onclick="location.reload()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> 
      Apps Hub
    </button>
    <button class="btn" onclick="saveReport()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> 
      Speichern
    </button>
    <button class="btn" onclick="startPrint()">
      <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> 
      Drucken / PDF
    </button>
    <button class="btn btn-secondary" onclick="toggleTheme()">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg> 
      Hell/Dunkel
    </button>
    <button class="btn btn-secondary" onclick="exportJSON()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> 
      Export JSON
    </button>
    <label class="btn btn-secondary" style="margin-bottom:0">
      <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> 
      Import JSON
      <input type="file" accept="application/json" style="display:none" onchange="importJSON(this.files[0])">
    </label>
  </div>

  <div class="container">
    <h1>Tätigkeitsbericht</h1>

    <div class="section">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
        <label class="btn" style="width:auto; margin-bottom:0;">
          <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          Logo wählen <input type="file" accept="image/*" style="display:none" onchange="importLogoFile(this.files[0])">
        </label>
        <button class="btn btn-danger" style="width:auto; margin-bottom:0;" onclick="clearLogo()">Löschen</button>
      </div>
      <div id="logoPrev" class="logo-preview"><span class="placeholder">Kein Logo ausgewählt</span></div>
    </div>

    <div class="header-grid">
      <div><label class="label">Kunde</label><input type="text" id="kunde" placeholder="Firmenname"></div>
      <div><label class="label">Projekt</label><input type="text" id="projekt" placeholder="Tätigkeit / Projekt"></div>
      <div><label class="label">Datum</label><input type="date" id="datum"></div>
      <div><label class="label">Mitarbeiter</label><input type="text" id="mitarbeiter" placeholder="Ihr Name"></div>
    </div>

    <div id="stats" class="stats">
      <div style="font-weight:600;margin-bottom:10px;">Projekt Übersicht</div>
      <div id="statsGrid" class="stats-grid"></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:40px">#</th>
            <th style="width:110px">Datum</th>
            <th>Aufgabe / Tätigkeit</th>
            <th style="width:140px">Von - Bis</th>
            <th style="width:70px">Std.</th>
            <th style="width:90px">Aktion</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
        <tfoot>
          <tr>
            <td colspan="4" style="text-align:right;font-weight:bold;padding-right:15px">Gesamt:</td>
            <td id="total" class="hours">00:00</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
    
    <button class="btn" onclick="addRow()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      Zeile hinzufügen
    </button>

    <div style="margin-top:25px">
      <label class="label">Bemerkungen</label>
      <textarea id="notes" placeholder="Zusätzliche Informationen, Materialverbrauch, etc..."></textarea>
    </div>

    <div style="margin-top:25px; border-top:2px solid var(--border-color); padding-top:20px;">
      <label class="label" for="sigName">Name des Unterzeichners</label>
      <input type="text" id="sigName" placeholder="Name eingeben">
      
      <div style="margin-top:10px; display:flex; gap:10px;">
        <button class="btn btn-secondary" style="flex:1" onclick="openSigModal()">
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path></svg>
          Zeichnen
        </button>
        <label class="btn btn-secondary" style="flex:1; margin-bottom:0">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Hochladen <input type="file" accept="image/*" style="display:none" onchange="importSigFile(this.files[0])">
        </label>
      </div>
      <div id="sigPrev" class="sig-preview"><span class="placeholder">Keine Unterschrift</span></div>
    </div>

    <div style="margin-top:40px; border-top:2px solid var(--border-color); padding-top:20px;">
      <h2>Gespeicherte Berichte</h2>
      <div id="reportsList"></div>
    </div>
  </div>

  <div id="printPages"></div>

  <div id="modal" class="modal">
    <div class="modal-content">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 class="modal-title" style="margin:0">Unterschrift erfassen</h3>
        <span class="close" onclick="closeSigModal()">&times;</span>
      </div>
      <div class="canvas-box">
        <div id="canvasHint" class="canvas-hint">Hier unterschreiben</div>
        <canvas id="sigCanvas"></canvas>
      </div>
      <div class="modal-btns">
        <button class="btn btn-danger" onclick="clearCanvas()">Löschen</button>
        <button class="btn btn-secondary" onclick="closeSigModal()">Abbrechen</button>
        <button class="btn" onclick="saveSignature()">Übernehmen</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    /* ==================== JAVASCRIPT LOGIC ==================== */
    let rowCount = 0;
    let reports = [];
    let logoData = null;
    let sigData = null;
    let canvas, ctx, isDrawing = false;

    // Icons (SVGs) für JS-generierte Zeilen
    const iconCopy = `<svg class="icon" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
    const iconTrash = `<svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`;

    // INIT
    window.onload = function() {
      document.getElementById('datum').valueAsDate = new Date();
      loadReportsFromStorage();
      if(document.querySelectorAll('#tbody tr').length === 0) addRow();
      
      // Theme Check
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      }
    };

    function toggleTheme() {
      document.body.classList.toggle('light-theme');
      const isLight = document.body.classList.contains('light-theme');
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
      toggleMobileMenu();
    }

    function toggleMobileMenu() {
      document.querySelector('.burger-toggle').classList.toggle('active');
      document.getElementById('mobileMenu').classList.toggle('active');
    }

    function toast(msg, type='info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type}`;
      t.style.display = 'block';
      setTimeout(() => t.style.display = 'none', 3000);
    }

    /* --- TABELLEN LOGIK --- */
    function addRow(data = {}) {
      rowCount++;
      const tbody = document.getElementById('tbody');
      const tr = document.createElement('tr');
      
      tr.innerHTML = `
        <td>${rowCount}</td>
        <td><input type="date" class="date-in" value="${data.date || ''}"></td>
        <td>
          <select class="task-sel" onchange="calcTotal()">
            <option value="">- Wählen -</option>
            <option>ANF-Anfahrt</option>
            <option>INST–Installation</option>
            <option>SCHUL–Schulung</option>
            <option>PJM-Echtbetrieb</option>
            <option>VAL–Validierung</option>
            <option>PJM–Projektmanagement</option>
            <option>ANF_INT–Interne Anfahrten</option>
			      <option>ANF_Kolo–Anfahrt ohne Berechnung zum Kunden</option>
			      <option>Kulanz–Kulanzdienstleistung</option>
          </select>
        </td>
        <td>
          <div style="display:flex;gap:5px;">
            <input type="time" class="t-start" value="${data.start || ''}" onchange="calcRow(this)">
            <input type="time" class="t-end" value="${data.end || ''}" onchange="calcRow(this)">
          </div>
        </td>
        <td class="hours">00:00</td>
        <td>
          <div style="display:flex;gap:5px;justify-content:center;">
            <button class="btn-row" onclick="dupRow(this)" title="Duplizieren">${iconCopy}</button>
            <button class="btn-row danger" onclick="delRow(this)" title="Löschen">${iconTrash}</button>
          </div>
        </td>
      `;
      
      if(data.task) tr.querySelector('.task-sel').value = data.task;
      
      // Datum kopieren oder heute setzen
      if(!data.date && rowCount > 1) {
        const prev = tbody.rows[tbody.rows.length-1];
        if(prev) tr.querySelector('.date-in').value = prev.querySelector('.date-in').value;
      } else if(!data.date) {
        tr.querySelector('.date-in').valueAsDate = new Date();
      }
      
      tbody.appendChild(tr);
      if(data.start && data.end) calcRow(tr.querySelector('.t-start'));
    }

    function dupRow(btn) {
      const src = btn.closest('tr');
      addRow({
        date: src.querySelector('.date-in').value,
        task: src.querySelector('.task-sel').value,
        start: src.querySelector('.t-start').value,
        end: src.querySelector('.t-end').value
      });
      calcTotal();
    }

    function delRow(btn) {
      if(document.querySelectorAll('#tbody tr').length <= 1) return toast('Mindestens eine Zeile ist erforderlich', 'error');
      btn.closest('tr').remove();
      renumberRows();
      calcTotal();
    }

    function renumberRows() {
      let i = 1;
      document.querySelectorAll('#tbody tr').forEach(r => r.querySelector('td:first-child').textContent = i++);
      rowCount = i - 1;
    }

    function calcRow(inp) {
      const r = inp.closest('tr');
      const s = r.querySelector('.t-start').value;
      const e = r.querySelector('.t-end').value;
      if(!s || !e) return;
      
      const [h1, m1] = s.split(':').map(Number);
      const [h2, m2] = e.split(':').map(Number);
      let diff = (h2 * 60 + m2) - (h1 * 60 + m1);
      if(diff < 0) diff += 1440; // Nachtschicht
      
      const hh = Math.floor(diff / 60);
      const mm = diff % 60;
      r.querySelector('.hours').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
      r.querySelector('.hours').dataset.mins = diff;
      calcTotal();
    }

    function calcTotal() {
      let sum = 0;
      const stats = {};
      document.querySelectorAll('#tbody tr').forEach(r => {
        const m = parseInt(r.querySelector('.hours').dataset.mins || 0);
        sum += m;
        const t = r.querySelector('.task-sel').value || 'Sonstiges';
        if(m > 0) stats[t] = (stats[t] || 0) + m;
      });
      
      const h = Math.floor(sum / 60);
      const m = sum % 60;
      document.getElementById('total').textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
      
      // Statistik rendern
      const grid = document.getElementById('statsGrid');
      grid.innerHTML = '';
      if(sum > 0) {
        document.getElementById('stats').style.display = 'block';
        for(const [task, mins] of Object.entries(stats)) {
          const sh = Math.floor(mins / 60);
          const sm = mins % 60;
          grid.innerHTML += `
            <div class="stat-item">
              <div class="stat-label">${task}</div>
              <div class="stat-value">${String(sh).padStart(2,'0')}:${String(sm).padStart(2,'0')}</div>
            </div>`;
        }
      } else {
        document.getElementById('stats').style.display = 'none';
      }
    }

    /* --- UNTERSCHRIFT & LOGO --- */
    function openSigModal() {
      document.getElementById('modal').style.display = 'flex';
      canvas = document.getElementById('sigCanvas');
      ctx = canvas.getContext('2d');
      
      // Resize
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      
      // Style
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#000';
      
      // Events (Maus & Touch)
      canvas.onmousedown = startDraw;
      canvas.onmousemove = draw;
      canvas.onmouseup = () => isDrawing = false;
      canvas.ontouchstart = e => { e.preventDefault(); startDraw(e.touches[0]); };
      canvas.ontouchmove = e => { e.preventDefault(); draw(e.touches[0]); };
      canvas.ontouchend = () => isDrawing = false;
    }

    function startDraw(e) {
      isDrawing = true;
      document.getElementById('canvasHint').classList.add('hide');
      const rect = canvas.getBoundingClientRect();
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }
    function draw(e) {
      if(!isDrawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    }
    function clearCanvas() { 
      ctx.clearRect(0,0,canvas.width,canvas.height); 
      document.getElementById('canvasHint').classList.remove('hide'); 
    }
    function closeSigModal() { document.getElementById('modal').style.display = 'none'; }
    function saveSignature() {
      sigData = canvas.toDataURL();
      document.getElementById('sigPrev').innerHTML = `<img src="${sigData}">`;
      closeSigModal();
    }

    function importLogoFile(f) {
      if(!f) return;
      const r = new FileReader();
      r.onload = e => { logoData = e.target.result; document.getElementById('logoPrev').innerHTML = `<img src="${logoData}">`; };
      r.readAsDataURL(f);
    }
    function clearLogo() { logoData = null; document.getElementById('logoPrev').innerHTML = '<span class="placeholder">Kein Logo ausgewählt</span>'; }
    function importSigFile(f) {
      if(!f) return;
      const r = new FileReader();
      r.onload = e => { sigData = e.target.result; document.getElementById('sigPrev').innerHTML = `<img src="${sigData}">`; };
      r.readAsDataURL(f);
    }

    /* --- SPEICHERN / LADEN --- */
    function getFormData() {
      const rows = [];
      document.querySelectorAll('#tbody tr').forEach(r => {
        rows.push({
          date: r.querySelector('.date-in').value,
          task: r.querySelector('.task-sel').value,
          start: r.querySelector('.t-start').value,
          end: r.querySelector('.t-end').value
        });
      });
      return {
        id: Date.now(),
        created: new Date().toLocaleString(),
        kunde: document.getElementById('kunde').value,
        projekt: document.getElementById('projekt').value,
        datum: document.getElementById('datum').value,
        mitarbeiter: document.getElementById('mitarbeiter').value,
        notes: document.getElementById('notes').value,
        sigName: document.getElementById('sigName').value,
        rows, logo: logoData, sig: sigData
      };
    }

    function saveReport() {
      const d = getFormData();
      if(!d.kunde) return toast('Bitte Kundennamen eingeben', 'error');
      reports.push(d);
      localStorage.setItem('reports', JSON.stringify(reports));
      loadReportsFromStorage();
      toast('Bericht erfolgreich gespeichert', 'success');
      if(document.getElementById('mobileMenu').classList.contains('active')) toggleMobileMenu();
    }

    function loadReportsFromStorage() {
      const r = localStorage.getItem('reports');
      if(r) reports = JSON.parse(r);
      const list = document.getElementById('reportsList');
      list.innerHTML = '';
      reports.slice().reverse().forEach(x => {
        list.innerHTML += `
          <div class="report-item">
            <div class="report-info">
              <strong>${x.kunde}</strong>
              <small>${x.projekt || 'Ohne Projekt'} | ${x.created}</small>
            </div>
            <div style="display:flex;gap:5px">
              <button class="btn-row" onclick="loadReport(${x.id})">${iconCopy}</button>
              <button class="btn-row danger" onclick="deleteReport(${x.id})">${iconTrash}</button>
            </div>
          </div>`;
      });
    }

    function loadReport(id) {
      const r = reports.find(x => x.id === id);
      if(!r) return;
      document.getElementById('kunde').value = r.kunde || '';
      document.getElementById('projekt').value = r.projekt || '';
      document.getElementById('datum').value = r.datum || '';
      document.getElementById('mitarbeiter').value = r.mitarbeiter || '';
      document.getElementById('notes').value = r.notes || '';
      document.getElementById('sigName').value = r.sigName || '';
      
      logoData = r.logo;
      document.getElementById('logoPrev').innerHTML = logoData ? `<img src="${logoData}">` : '<span class="placeholder">Kein Logo ausgewählt</span>';
      sigData = r.sig;
      document.getElementById('sigPrev').innerHTML = sigData ? `<img src="${sigData}">` : '<span class="placeholder">Keine Unterschrift</span>';
      
      document.getElementById('tbody').innerHTML = '';
      rowCount = 0;
      if(r.rows && r.rows.length) {
        r.rows.forEach(row => addRow(row));
      } else {
        addRow();
      }
      calcTotal();
      toast('Bericht geladen', 'success');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteReport(id) {
      if(!confirm('Diesen Bericht wirklich löschen?')) return;
      reports = reports.filter(x => x.id !== id);
      localStorage.setItem('reports', JSON.stringify(reports));
      loadReportsFromStorage();
    }

    function exportJSON() {
      const d = getFormData();
      const b = new Blob([JSON.stringify(d, null, 2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = `Bericht_${d.kunde.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      if(document.getElementById('mobileMenu').classList.contains('active')) toggleMobileMenu();
    }
    
    function importJSON(f) {
      const r = new FileReader();
      r.onload = e => {
        try {
          const d = JSON.parse(e.target.result);
          d.id = Date.now();
          reports.push(d);
          loadReport(d.id);
          reports.pop();
          if(document.getElementById('mobileMenu').classList.contains('active')) toggleMobileMenu();
          toast('Daten importiert', 'success');
        } catch(err) { toast('Fehler beim Importieren', 'error'); }
      };
      r.readAsText(f);
    }

    /* --- DRUCK-LOGIK (PDF) --- */
    
    // Hilfsfunktion: Datum von YYYY-MM-DD zu DD.MM.YYYY
    function formatDateDE(dateStr) {
      if(!dateStr) return '';
      const parts = dateStr.split('-');
      if(parts.length !== 3) return dateStr;
      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }
    
    function startPrint() {
      if(document.getElementById('mobileMenu').classList.contains('active')) toggleMobileMenu();
      buildPrintPages();
      setTimeout(() => window.print(), 500);
    }

    function buildPrintPages() {
      const con = document.getElementById('printPages');
      con.innerHTML = '';
      const rows = Array.from(document.querySelectorAll('#tbody tr'));
      const chunks = [];
      
      // Tabelle in Blöcke aufteilen (18 Zeilen pro Seite)
      while(rows.length) chunks.push(rows.splice(0, 12));
      if(chunks.length === 0) chunks.push([]);

      const d = getFormData();
      const total = document.getElementById('total').textContent;

      chunks.forEach((chunk, i) => {
        const isLast = i === chunks.length - 1;
        let html = `
          <div class="print-page">
            <div class="print-header">
              <div class="print-meta">
                <h2 style="margin:0 0 10px 0;color:#1E2434;border:none;padding:0;background:none;font-size:20pt;box-shadow:none;text-shadow:none;">Tätigkeitsbericht</h2>
                <div class="meta-row"><span class="meta-label">Kunde:</span><span>${d.kunde}</span></div>
                <div class="meta-row"><span class="meta-label">Projekt:</span><span>${d.projekt}</span></div>
                <div class="meta-row"><span class="meta-label">Mitarbeiter:</span><span>${d.mitarbeiter}</span></div>
                <div class="meta-row"><span class="meta-label">Datum:</span><span>${formatDateDE(d.datum)}</span></div>
              </div>
              ${d.logo ? `<img src="${d.logo}" class="print-logo">` : ''}
            </div>
            <table class="print-table">
              <thead><tr><th>Datum</th><th>Von</th><th>Bis</th><th>Aufgabe / Tätigkeit</th><th>Std.</th></tr></thead>
              <tbody>
        `;
        
        chunk.forEach(tr => {
          const dateVal = tr.querySelector('.date-in').value;
          const startVal = tr.querySelector('.t-start').value;
          const endVal = tr.querySelector('.t-end').value;
          const taskVal = tr.querySelector('.task-sel').value;
          const hoursVal = tr.querySelector('.hours').textContent;

          html += `<tr>
            <td>${formatDateDE(dateVal)}</td>
            <td>${startVal}</td>
            <td>${endVal}</td>
            <td style="text-align:left">${taskVal}</td>
            <td>${hoursVal}</td>
          </tr>`;
        });
        
        html += `</tbody></table>`;
        
        if(isLast) {
          html += `
            <div style="text-align:right;font-weight:bold;font-size:12pt;margin-bottom:10px;border-top:2px solid #1E2434;padding-top:5px;">Gesamtstunden: ${total}</div>
            ${d.notes ? `<div class="print-notes"><strong>Bemerkungen:</strong><br>${d.notes.replace(/\n/g,'<br>')}</div>` : ''}
            
            <div class="print-footer">
              <div class="sig-box">
                ${d.sig ? `<img src="${d.sig}" class="sig-img">` : '<div style="height:15mm"></div>'}
                <div>${d.sigName ? d.sigName : 'Unterschrift'}</div>
              </div>
              <div class="page-num">Seite ${i+1} von ${chunks.length}</div>
            </div>
          `;
        } else {
          html += `
            <div class="print-footer">
              <div></div>
              <div class="page-num">Seite ${i+1} von ${chunks.length}</div>
            </div>`;
        }
        
        html += `</div>`;
        con.innerHTML += html;
      });
    }
  </script>
</body>
</html>
