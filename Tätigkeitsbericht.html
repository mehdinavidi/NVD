<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps Hub - Nexus/IPS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2d1b2e 0%, #4a2545 50%, #2d1b2e 100%);
            height: 100vh;
            color: white;
            position: relative;
            overflow-y: auto;
        }

        /* Container für zentrierte Inhalte */
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 15px;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            padding: 15px 0;
            gap: 10px;
            width: 100%;
        }

        .header-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            overflow: hidden;
        }

        .header-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header h1 {
            font-size: 1.1em;
            font-weight: 600;
        }

        /* Hero Section */
        .hero {
            margin: 20px 0 30px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 220px;
            width: 100%;
        }

        .hero-image {
            background: url('photos/Hero.png');
            background-size: cover;
            background-position: center;
            min-height: 220px;
        }

        .hero-content {
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 100%;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(139, 21, 56, 0.3);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.75em;
            margin-bottom: 12px;
            width: fit-content;
        }

        .hero-badge::before {
            content: "🆕";
        }

        .hero-title {
            font-size: 1.6em;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.2;
        }

        .hero-description {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .hero-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 8px;
            border: none;
            font-size: 0.85em;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #8B1538;
            color: white;
        }

        .btn-primary:hover {
            background: #a81d45;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Apps Section */
        .apps-section {
            padding: 0 0 30px;
            width: 100%;
        }

        .apps-title {
            font-size: 1.4em;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .apps-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 100%;
        }

        /* App Card */
        .app-card {
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            position: relative;
        }

        .app-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 15px 50px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .app-card img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Blur Background Effect beim Hover */
        .app-card::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
            filter: blur(40px) brightness(0.7);
            pointer-events: none;
        }

        .app-card:hover::before {
            opacity: 0.4;
        }

        /* Individuelle Hintergrundbilder für jede Kachel */
        .app-card:nth-child(1)::before {
            background-image: url('photos/tätigkeitsbericht.png');
        }

        .app-card:nth-child(2)::before {
            background-image: url('photos/Reisekosten.png');
        }

        .app-card:nth-child(3)::before {
            background-image: url('photos/EuroSDS.png');
        }

        .app-card:nth-child(4)::before {
            background-image: url('photos/Validierung.png');
        }

        .app-card:nth-child(5)::before {
            background-image: url('photos/Wissen.png');
        }

        .app-card:nth-child(6)::before {
            background-image: url('photos/Mehrarbeit.png');
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            opacity: 0.6;
            font-size: 0.8em;
            width: 100%;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero {
                grid-template-columns: 1fr;
            }

            .hero-image {
                min-height: 180px;
            }

            .hero-content {
                padding: 25px;
            }

            .hero-title {
                font-size: 1.4em;
            }

            .apps-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 12px;
            }

            .hero {
                margin: 15px 0 20px;
            }

            .hero-content {
                padding: 20px;
            }

            .hero-title {
                font-size: 1.3em;
            }

            .hero-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .apps-grid {
                grid-template-columns: 1fr;
            }

            .apps-title {
                font-size: 1.2em;
            }
        }

        @media (max-width: 480px) {
            .hero-content {
                padding: 18px;
            }

            .hero-title {
                font-size: 1.2em;
            }

            .hero-description {
                font-size: 0.85em;
            }

            .apps-title {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">
                <img src="photos/Apps-icone.png" alt="Apps Icon">
            </div>
            <h1>Apps Hub</h1>
        </div>

        <!-- Hero Section -->
        <div class="hero">
            <div class="hero-image"></div>
            <div class="hero-content">
                <div class="hero-badge">Neu & empfohlen</div>
                <h2 class="hero-title">Dein zentraler Startpunkt</h2>
                <p class="hero-description">
                    Schneller Zugriff auf deine Web-Apps mit dynamischem Hintergrund und kompakten Kacheln.
                </p>
                <div class="hero-buttons">
                    <button class="btn btn-primary">Info</button>
                    <button class="btn btn-secondary">Modus: Hell</button>
                </div>
            </div>
        </div>

        <!-- Apps Section -->
        <div class="apps-section">
            <h2 class="apps-title">Apps</h2>
            <div class="apps-grid">
                <!-- Tätigkeitsbericht -->
                <a href="Tätigkeitsbericht.html" class="app-card">
                    <img src="photos/tätigkeitsbericht.png" alt="Tätigkeitsbericht">
                </a>

                <!-- Reisekosten -->
                <a href="Reisekostenabrechnung.html" class="app-card">
                    <img src="photos/Reisekosten.png" alt="Reisekosten">
                </a>

                <!-- EuroSDS -->
                <a href="EuroSDS.html" class="app-card">
                    <img src="photos/EuroSDS.png" alt="EuroSDS">
                </a>

                <!-- Validierung -->
                <a href="Validierungs-Protokoll.html" class="app-card">
                    <img src="photos/Validierung.png" alt="Validierung">
                </a>

                <!-- Wissen -->
                <a href="Wissen.html" class="app-card">
                    <img src="photos/Wissen.png" alt="Wissen">
                </a>

                <!-- Mehrarbeit -->
                <a href="Mehrarbeit.html" class="app-card">
                    <img src="photos/Mehrarbeit.png" alt="Mehrarbeit">
                </a>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p><strong>Nexus/IPS</strong></p>
            <p>© 2024 Alle Rechte vorbehalten</p>
        </div>
    </div>
</body>
</html>
